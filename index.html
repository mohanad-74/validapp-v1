<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValidApp - Validation & Qualification Nerhadou</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">

  <div class="container mx-auto p-6">
    <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-700">
      <h1 class="text-2xl font-bold text-blue-400">ValidApp</h1>
      <div id="userInfo" class="text-sm text-slate-300">
        Logged in as: <span id="userEmail" class="font-semibold text-white">QA User</span>
      </div>
    </header>

    <main class="max-w-2xl mx-auto bg-slate-800 p-6 rounded-lg shadow-lg">
      <h2 class="text-xl font-semibold mb-4">Controlled Documents Upload</h2>
      
      <div class="mb-4">
        <label for="studyIdInput" class="block text-sm font-medium mb-1">Study ID / Product</label>
        <input type="text" id="studyIdInput" value="PV-2026-001" class="w-full p-2 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
      </div>

      <div class="mb-6">
        <label for="fileInput" class="block text-sm font-medium mb-1">Select Files to Upload</label>
        <input type="file" id="fileInput" multiple class="w-full text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer border border-slate-600 rounded p-1 bg-slate-700">
      </div>

      <div id="uploadStatus" class="text-sm font-medium text-blue-400 min-h-[20px]"></div>
    </main>
  </div>

  <script>
    // ==========================================
    // 1. INITIALIZE SUPABASE CLIENT
    // ==========================================
    // Replace these credentials with your actual Supabase URL and Anon Key if needed
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mock Current User
    const currentUser = {
      email: 'mohannad@validapp.com'
    };

    // Global study tracker
    window.currentSelectedStudyId = 'PV-2026-001';

    // ==========================================
    // 2. FIXED UPLOAD FUNCTION
    // ==========================================
    async function uploadFiles(files, studyId) {
      if (!files || files.length === 0) return;

      const uploadStatus = document.getElementById('uploadStatus');
      if (uploadStatus) uploadStatus.textContent = 'Uploading files...';

      try {
        for (const file of files) {
          // Clean filename to prevent storage path syntax issues
          const cleanFileName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_');
          const filePath = `${studyId}/${Date.now()}_${cleanFileName}`;

          // ✅ FIX (Line 379): Bucket name passed as string 'documents' instead of undeclared variable
          const { data, error: uploadError } = await supabase.storage
            .from('documents')
            .upload(filePath, file, {
              cacheControl: '3600',
              upsert: false
            });

          if (uploadError) {
            throw uploadError;
          }

          // Fetch Public URL
          const { data: urlData } = supabase.storage
            .from('documents')
            .getPublicUrl(filePath);

          console.log('File uploaded successfully:', urlData.publicUrl);
        }

        if (uploadStatus) uploadStatus.textContent = 'Upload completed successfully!';
        alert('Files uploaded successfully!');
      } catch (error) {
        console.error('Supabase Upload Error:', error);
        if (uploadStatus) uploadStatus.textContent = 'Upload failed.';
        alert(`Upload failed: ${error.message || error}`);
      }
    }

    // ==========================================
    // 3. FIXED EVENT LISTENER
    // ==========================================
    // ✅ FIX (Line 840): Listens for file input change and triggers uploadFiles correctly
    document.getElementById('fileInput')?.addEventListener('change', async function (e) {
      const files = e.target.files;
      const activeStudyId = document.getElementById('studyIdInput')?.value || window.currentSelectedStudyId || 'PV-DEFAULT';

      if (files && files.length > 0) {
        await uploadFiles(files, activeStudyId);
        e.target.value = ''; // Reset file input selection
      }
    });
  </script>
</body>
</html>
