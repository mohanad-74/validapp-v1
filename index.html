<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValidApp - Validation & Qualification Nerhadou</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- SheetJS for Excel Processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- MSAL.js for Azure AD SSO -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Firebase Configurations ---
    const MY_FIREBASE_CONFIG = {
      apiKey: "YOUR_API_KEY_FROM_FIREBASE",
      authDomain: "YOUR_AUTH_DOMAIN_FROM_FIREBASE",
      projectId: "YOUR_PROJECT_ID_FROM_FIREBASE",
      storageBucket: "YOUR_STORAGE_BUCKET_FROM_FIREBASE",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID_FROM_FIREBASE",
      appId: "YOUR_APP_ID_FROM_FIREBASE"
    };

    // --- Supabase Configuration (Safely handled if placeholders are present) ---
    const SUPABASE_URL = "https://placeholder.supabase.co"; // Replace with your URL if using
    const SUPABASE_ANON_KEY = "placeholder-key"; // Replace with your key if using

    // --- EmailJS Configuration ---
    const EMAILJS_PUBLIC_KEY = "YOUR_EMAILJS_PUBLIC_KEY";
    const EMAILJS_SERVICE_ID = "YOUR_EMAILJS_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "YOUR_EMAILJS_TEMPLATE_ID";

    if (window.emailjs && EMAILJS_PUBLIC_KEY !== "YOUR_EMAILJS_PUBLIC_KEY") {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    }

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : MY_FIREBASE_CONFIG;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'validapp-default';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let supabaseClient = null;
    try {
      if (window.supabase && SUPABASE_URL.startsWith('http')) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase initialization skipped:", e);
    }

    const ROLES = Object.freeze({
      ADMIN: 'Administrator',
      CREATOR: 'Creator',
      SECTION_HEAD: 'Section Head',
      DEPUTY: 'Deputy QA Manager',
      QA_MANAGER: 'QA Manager',
      REVIEWER: 'Reviewer — Other Department',
      VIEWER: 'Viewer'
    });

    const STATUS = Object.freeze({
      DRAFT: 'Draft',
      PENDING_SECTION_HEAD: 'Pending Section Head',
      PENDING_REVIEWER: 'Pending Reviewer',
      PENDING_DEPUTY: 'Pending Deputy QA',
      PENDING_QA: 'Pending QA Manager',
      RETURNED: 'Returned for Revision',
      APPROVED: 'Approved',
      REJECTED: 'Rejected',
      COMPLETED: 'Completed'
    });

    const CATEGORIES = Object.freeze({ PROCESS: 'Process Validation', HOLD_TIME: 'Hold Time Study', CLEANING: 'Cleaning Validation' });
    const MODULES = Object.freeze({ STUDIES: 'Studies', CALIBRATION: 'Calibration', QUALIFICATION: 'Qualification' });

    let currentUser = null;
    let currentProfile = null;
    let currentModule = MODULES.STUDIES;
    let currentStudyCategory = CATEGORIES.PROCESS;

    let studiesRecords = [];
    let selectedModuleIds = new Set();

    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const colRef = name => collection(db, 'artifacts', appId, 'public', 'data', name);
    const docRef = (name, id) => doc(db, 'artifacts', appId, 'public', 'data', name, id);

    function showMessage(title = 'Information', text = '', type = 'info') {
      $('messageTitle').textContent = title;
      $('messageText').textContent = text;
      $('messageModal').classList.add('active');
    }

    async function loadProfile(user) {
      const snap = await getDoc(docRef('users', user.uid));
      if (!snap.exists()) throw new Error('Profile not found. Contact Admin.');
      const profile = snap.data();
      if (profile.disabled === true) throw new Error('Account disabled.');
      return { id: snap.id, ...profile };
    }

    async function loadStudies() {
      if (!currentProfile) return;
      try {
        let q = query(colRef('records'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        studiesRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        populateStudyFilters();
        renderStudiesTable();
      } catch (e) {
        console.error(e);
        showMessage('Data error', 'Studies could not be loaded.', 'error');
      }
    }

    function populateStudyFilters() {
      const currentCatRecords = studiesRecords.filter(r => r.studyCategory === currentStudyCategory);
      const stages = [...new Set(currentCatRecords.map(r => r.stage).filter(Boolean))].sort();
      const scales = [...new Set(currentCatRecords.map(r => r.scale).filter(Boolean))].sort();

      const stageSelect = $('filterStage');
      const scaleSelect = $('filterScale');
      if (stageSelect) {
        stageSelect.innerHTML = `<option value="All">All Stages</option>` + stages.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
      }
      if (scaleSelect) {
        scaleSelect.innerHTML = `<option value="All">All Scales</option>` + scales.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
      }
    }

    function renderStudiesTable() {
      const tbody = $('studiesTableBody');
      if (!tbody) return;

      const searchTerm = ($('searchStudies')?.value || '').toLowerCase();
      const filterStage = $('filterStage')?.value || 'All';
      const filterScale = $('filterScale')?.value || 'All';
      const filterStatus = $('filterStatus')?.value || 'All';

      const filtered = studiesRecords.filter(r => {
        if (r.studyCategory !== currentStudyCategory) return false;
        if (filterStage !== 'All' && r.stage !== filterStage) return false;
        if (filterScale !== 'All' && r.scale !== filterScale) return false;
        if (filterStatus !== 'All' && r.status !== filterStatus) return false;
        if (searchTerm) {
          const matchStr = `${r.studyName} ${r.productName} ${r.protocolNumber}`.toLowerCase();
          if (!matchStr.includes(searchTerm)) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500">No records found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(r => `
        <tr class="hover:bg-gray-50 border-b">
          <td class="px-4 py-3"><input type="checkbox" class="study-checkbox" data-id="${r.id}" ${selectedModuleIds.has(r.id) ? 'checked' : ''}></td>
          <td class="px-4 py-3 font-medium text-gray-900">${esc(r.studyName || r.productName)}</td>
          <td class="px-4 py-3">${esc(r.protocolNumber || '—')}</td>
          <td class="px-4 py-3">${esc(r.stage || '—')}</td>
          <td class="px-4 py-3">${esc(r.scale || '—')}</td>
          <td class="px-4 py-3">${esc(r.status || STATUS.DRAFT)}</td>
          <td class="px-4 py-3 text-right">
            <button onclick="window.viewStudy('${r.id}')" class="text-blue-600 hover:text-blue-800"><i class="fas fa-eye"></i></button>
          </td>
        </tr>
      `).join('');
    }

    onAuthStateChanged(auth, async (user) => {
      try {
        if (user) {
          currentUser = user;
          currentProfile = await loadProfile(user);
          $('loginSection').classList.add('hidden');$('dashboardSection').classList.remove('hidden');
          $('userInfo').classList.remove('hidden');$('currentUserDisplay').textContent = currentProfile.displayName || user.email;
          $('currentUserRole').textContent = currentProfile.role;
          await loadStudies();
        } else {
          currentUser = null;
          currentProfile = null;
          $('loginSection').classList.remove('hidden');
          $('dashboardSection').classList.add('hidden');$('userInfo').classList.add('hidden');
        }
      } catch (err) {
        console.error("Auth state error:", err);
        signOut(auth);
      }
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('loginEmail').value.trim();
      const pass = $('loginPassword').value;
      $('loginError').classList.add('hidden');
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        $('loginError').textContent = err.message;
        $('loginError').classList.remove('hidden');
      }
    });
  </script>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
  
  <!-- Login Section -->
  <div id="loginSection" class="flex items-center justify-center h-full bg-slate-900">
    <div class="bg-white p-8 rounded-lg shadow-xl w-96">
      <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">ValidApp Login</h2>
      <div id="loginError" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"></div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email Address</label>
          <input type="email" id="loginEmail" required class="w-full mt-1 px-3 py-2 border rounded-md focus:ring focus:ring-blue-300">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="loginPassword" required class="w-full mt-1 px-3 py-2 border rounded-md focus:ring focus:ring-blue-300">
        </div>
        <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-md font-semibold hover:bg-blue-700 transition">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboardSection" class="hidden flex flex-col h-full overflow-hidden">
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm">
      <div class="flex items-center space-x-3">
        <h1 class="text-xl font-bold text-slate-800">ValidApp - Validation & Qualification</h1>
      </div>
      <div id="userInfo" class="flex items-center space-x-4">
        <div class="text-right">
          <span id="currentUserDisplay" class="block font-semibold text-sm text-gray-800"></span>
          <span id="currentUserRole" class="block text-xs text-blue-600 font-medium"></span>
        </div>
        <button onclick="window.location.reload()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded text-sm font-medium transition">Logout</button>
      </div>
    </header>

    <main class="flex-grow flex flex-col overflow-hidden p-6 bg-slate-50">
      <div class="bg-white rounded-lg shadow flex flex-col flex-grow overflow-hidden">
        <div class="p-4 border-b flex justify-between items-center bg-white">
          <div class="flex items-center space-x-3">
            <input type="text" id="searchStudies" placeholder="Search studies..." class="px-3 py-1.5 border rounded-md text-sm w-64 focus:ring focus:ring-blue-300" oninput="window.renderStudiesTable()">
            <select id="filterStage" class="px-3 py-1.5 border rounded-md text-sm" onchange="window.renderStudiesTable()"><option value="All">All Stages</option></select>
            <select id="filterScale" class="px-3 py-1.5 border rounded-md text-sm" onchange="window.renderStudiesTable()"><option value="All">All Scales</option></select>
            <select id="filterStatus" class="px-3 py-1.5 border rounded-md text-sm" onchange="window.renderStudiesTable()">
              <option value="All">All Statuses</option>
              <option value="Draft">Draft</option>
              <option value="Approved">Approved</option>
            </select>
          </div>
        </div>

        <div class="flex-grow overflow-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100 sticky top-0 text-xs uppercase text-gray-600 font-semibold">
              <tr>
                <th class="px-4 py-3"><input type="checkbox" id="selectAllModule"></th>
                <th class="px-4 py-3">Study / Product Name</th>
                <th class="px-4 py-3">Protocol No.</th>
                <th class="px-4 py-3">Stage</th>
                <th class="px-4 py-3">Scale</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="studiesTableBody" class="text-sm divide-y divide-gray-200">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div id="messageModal" class="modal fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
      <h3 id="messageTitle" class="text-lg font-bold mb-2"></h3>
      <p id="messageText" class="text-sm text-gray-600 mb-4"></p>
      <button onclick="document.getElementById('messageModal').classList.remove('active')" class="w-full py-2 bg-blue-600 text-white rounded font-medium">OK</button>
    </div>
  </div>

  <style>
    .modal.active { display: flex !important; }
  </style>
</body>
</html>
