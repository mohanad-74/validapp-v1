<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValidApp - Validation & Qualification Nerhadou</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- SheetJS for Excel Processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- MSAL.js for Azure AD SSO -->
  <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>

  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script type="module">
    import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Firebase Configurations ---
    const MY_FIREBASE_CONFIG = {
      // IMPORTANT: Insert your Firebase Config here
      apiKey: "YOUR_API_KEY_FROM_FIREBASE",
      authDomain: "YOUR_AUTH_DOMAIN_FROM_FIREBASE",
      projectId: "YOUR_PROJECT_ID_FROM_FIREBASE",
      storageBucket: "YOUR_STORAGE_BUCKET_FROM_FIREBASE",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID_FROM_FIREBASE",
      appId: "YOUR_APP_ID_FROM_FIREBASE",
      measurementId: "YOUR_MEASUREMENT_ID_FROM_FIREBASE"
    };

    // --- Supabase Configuration ---
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    // --- EmailJS Configuration ---
    const EMAILJS_PUBLIC_KEY = "YOUR_EMAILJS_PUBLIC_KEY";
    const EMAILJS_SERVICE_ID = "YOUR_EMAILJS_SERVICE_ID";
    const EMAILJS_TEMPLATE_ID = "YOUR_EMAILJS_TEMPLATE_ID";

    if (window.emailjs) {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    }

    const msalConfig = {
      auth: {
        // IMPORTANT: Insert your Azure AD App Registration details
        clientId: "YOUR_AZURE_CLIENT_ID",
        authority: "https://login.microsoftonline.com/YOUR_TENANT_ID",
        redirectUri: window.location.origin + window.location.pathname
      },
      cache: { cacheLocation: "localStorage", storeAuthStateInCookie: false }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);

    // Use provided config or fallback to MY_FIREBASE_CONFIG
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : MY_FIREBASE_CONFIG;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'validapp-default';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const ROLES = Object.freeze({
      ADMIN: 'Administrator',
      CREATOR: 'Creator',
      SECTION_HEAD: 'Section Head',
      DEPUTY: 'Deputy QA Manager',
      QA_MANAGER: 'QA Manager',
      REVIEWER: 'Reviewer — Other Department',
      VIEWER: 'Viewer'
    });

    const ROLE_LIST = Object.values(ROLES);
    const STATUS = Object.freeze({
      DRAFT: 'Draft',
      PENDING_SECTION_HEAD: 'Pending Section Head',
      PENDING_REVIEWER: 'Pending Reviewer',
      PENDING_DEPUTY: 'Pending Deputy QA',
      PENDING_QA: 'Pending QA Manager',
      RETURNED: 'Returned for Revision',
      APPROVED: 'Approved',
      REJECTED: 'Rejected',
      COMPLETED: 'Completed'
    });

    const CATEGORIES = Object.freeze({ PROCESS: 'Process Validation', HOLD_TIME: 'Hold Time Study', CLEANING: 'Cleaning Validation' });
    const MODULES = Object.freeze({ STUDIES: 'Studies', CALIBRATION: 'Calibration', QUALIFICATION: 'Qualification' });

    const ALLOWED_FILE_TYPES = Object.freeze({
      'application/pdf': '.pdf',
      'application/msword': '.doc',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '.docx',
      'application/vnd.ms-excel': '.xls',
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': '.xlsx',
      'image/jpeg': '.jpg/.jpeg',
      'image/png': '.png'
    });
    const MAX_FILE_SIZE = 25 * 1024 * 1024;

    // App State
    let currentUser = null;
    let currentProfile = null;
    let currentModule = MODULES.STUDIES; // Default to Studies
    let currentStudyCategory = CATEGORIES.PROCESS; // Default tab in Studies

    // Data Collections
    let studiesRecords = []; // Specifically for Studies module
    let moduleRecords = [];  // Shared for Calibration and Qualification modules
    let filesByParent = [];
    let users = [];
    let auditLogs = [];
    let pendingAction = null;

    // Selection State (used by ALL modules now)
    let selectedModuleIds = new Set();

    // Helpers
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeFileName = name => String(name).replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 180);
    const nowLabel = value => {
      if (!value) return '—';
      const d = value?.toDate ? value.toDate() : new Date(value);
      return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString();
    };
    const colRef = name => collection(db, 'artifacts', appId, 'public', 'data', name);
    const docRef = (name, id) => doc(db, 'artifacts', appId, 'public', 'data', name, id);

    const can = (...roles) => !!currentProfile && roles.includes(currentProfile.role);
    const isAdmin = () => can(ROLES.ADMIN);
    const isCreator = () => can(ROLES.CREATOR);
    const isReviewer = () => can(ROLES.SECTION_HEAD, ROLES.REVIEWER, ROLES.DEPUTY, ROLES.QA_MANAGER);
    const isViewer = () => can(ROLES.VIEWER);

    // UI Utilities
    function showMessage(title = 'Information', text = '', type = 'info') {
      if (!title && !text) return;
      $('messageTitle').textContent = title \vert{}\vert{} 'Notification';$('messageText').textContent = text || title;
      $('messageIcon').innerHTML = type === 'error' ? '<i class="fas fa-times-circle text-4xl text-red-500"></i>' : type === 'success' ? '<i class="fas fa-check-circle text-4xl text-green-500"></i>' : '<i class="fas fa-info-circle text-4xl text-blue-500"></i>';
      $('messageModal').classList.add('active');
    }

    function confirmAction(title, text, callback, requireReason=false, reasonLabel='Reason / comment *') {
      pendingAction = callback;
      $('confirmTitle').textContent = title;
      $('confirmText').textContent = text;
      $('reasonLabel').textContent = reasonLabel;
      $('reasonInput').value = '';
      $('reasonWrap').classList.toggle('hidden', !requireReason);$('confirmModal').classList.add('active');
    }

    function closeModals() {
      document.querySelectorAll('.modal').forEach(x => x.classList.remove('active'));
      pendingAction = null;
    }

    async function sendEmailNotification(recipientEmail, actionTaken, username, productDetails, currentStatus, auditDetails) {
      if (!window.emailjs || !recipientEmail) return;
      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: recipientEmail,
          action_taken: actionTaken || 'System Action',
          timestamp: new Date().toLocaleString(),
          username: username || currentProfile?.displayName || currentUser?.email || 'Unknown User',
          product_details: productDetails || 'N/A',
          current_status: currentStatus || 'N/A',
          audit_details: auditDetails || 'No additional details provided.'
        });
      } catch (err) {
        console.error('EmailJS dispatch failed:', err);
      }
    }

    function statusBadge(status) {
      const cls = status === STATUS.APPROVED || status === STATUS.COMPLETED ? 'bg-green-100 text-green-800 border-green-200' : status === STATUS.REJECTED ? 'bg-red-100 text-red-800 border-red-200' : status === STATUS.RETURNED ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-blue-50 text-blue-800 border-blue-200';
      return `<span class="px-2 py-1 inline-flex text-xs font-semibold rounded-full border ${cls}">${esc(status || '—')}</span>`;
    }

    async function logAudit(action, parentId='', parentName='', details='', previousStatus='', newStatus='') {
      try { 
        await addDoc(colRef('audit'), {
          userId: currentUser.uid,
          userName: currentProfile?.displayName || currentProfile?.username || currentUser.email || currentUser.uid,
          userRole: currentProfile?.role || 'Unknown',
          action, studyId: parentId || null, studyName: parentName || null,
          previousStatus: previousStatus || null, newStatus: newStatus || null,
          details: details || '', createdAt: serverTimestamp(), clientTimestamp: new Date().toISOString()
        }); 
      } catch (e) { console.error('Audit write failed', e); }
    }

    // Core App Management
    function resetAppUI() {
      $('loginSection').classList.remove('hidden');
      $('dashboardSection').classList.add('hidden');$('userInfo').classList.add('hidden');
      $('loginForm').reset();$('loginError').classList.add('hidden');
    }

    function configureNavigation() {
      $('userManagementBtn').classList.toggle('hidden', !isAdmin());
      $('auditTrailBtn').classList.toggle('hidden', !can(ROLES.ADMIN, ROLES.QA_MANAGER, ROLES.DEPUTY));$('calibrationNav').classList.toggle('hidden', !(isAdmin() || isCreator() || isReviewer() || isViewer()));
      $('qualificationNav').classList.toggle('hidden', !(isAdmin() \vert{}\vert{} isCreator() \vert{}\vert{} isReviewer() \vert{}\vert{} isViewer()));$('addRecordBtn').classList.toggle('hidden', !(isAdmin() || isCreator()));
      $('addModuleBtn').classList.toggle('hidden', !(isAdmin() \vert{}\vert{} isCreator())); // Ensure this is available for Cal/Qual$('currentUserDisplay').textContent = currentProfile?.displayName || currentProfile?.username || currentUser.email;
      $('currentUserRole').textContent = currentProfile?.role \vert{}\vert{} 'Unassigned';$('currentUserDepartment').textContent = currentProfile?.department || '—';
    }

    async function loadProfile(user) {
      const snap = await getDoc(docRef('users', user.uid));
      if (!snap.exists()) throw new Error('Profile not found. Contact Admin.');
      const profile = snap.data();
      if (profile.disabled === true) throw new Error('Account disabled.');
      return { id: snap.id, ...profile };
    }

    // --- STUDIES MODULE LOGIC ---
    async function loadStudies() {
      if (!currentProfile) return;
      try {
        let q;
        if (isAdmin()) q = query(colRef('records'), orderBy('createdAt', 'desc'));
        else if (isCreator()) q = query(colRef('records'), where('createdByUid', '==', currentUser.uid));
        else if (can(ROLES.SECTION_HEAD)) q = query(colRef('records'), where('status', '==', STATUS.PENDING_SECTION_HEAD));
        else if (can(ROLES.REVIEWER)) q = query(colRef('records'), where('status', '==', STATUS.PENDING_REVIEWER));
        else if (can(ROLES.DEPUTY)) q = query(colRef('records'), where('status', '==', STATUS.PENDING_DEPUTY));
        else if (can(ROLES.QA_MANAGER)) q = query(colRef('records'), where('status', '==', STATUS.PENDING_QA));
        else q = query(colRef('records'), where('status', '==', STATUS.APPROVED));
        const snap = await getDocs(q);
        studiesRecords = snap.docs.map(d => ({id:d.id, ...d.data()}));
        studiesRecords.sort((a,b) => String(b.createdAt?.seconds || '').localeCompare(String(a.createdAt?.seconds || '')));
        
        // Re-populate dropdown filters
        populateStudyFilters();
        renderStudiesTable();
      } catch (e) {
        console.error(e);
        showMessage('Data error', 'Studies could not be loaded.', 'error');
      }
    }

    function setStudyCategoryTabs() {
      document.querySelectorAll('.study-tab').forEach(x => x.classList.remove('bg-white', 'text-primary', 'shadow-sm'));
      const tabMap = { [CATEGORIES.PROCESS]: 'tabProcess', [CATEGORIES.HOLD_TIME]: 'tabHoldTime', [CATEGORIES.CLEANING]: 'tabCleaning' };
      const activeTabId = tabMap[currentStudyCategory];
      if ($(activeTabId))$(activeTabId).classList.add('bg-white', 'text-primary', 'shadow-sm');
    }

    function populateStudyFilters() {
      const stages = [...new Set(studiesRecords.filter(r => r.studyCategory === currentStudyCategory).map(r => r.stage).filter(Boolean))].sort();
      const scales = [...new Set(studiesRecords.filter(r => r.studyCategory === currentStudyCategory).map(r => r.scale).filter(Boolean))].sort();

      $('filterStage').innerHTML = `<option value="All">All Stages</option>` + stages.map(
