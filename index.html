    const ROLES = Object.freeze({

      PENDING_DEPUTY: 'Pending Deputy QA',
      PENDING_QA: 'Pending QA Manager',
      RETURNED: 'Returned for Revision',

    const MODULES = Object.freeze({

      SOPS: 'SOPs',

    });

    const PROCESS_TABS = Object.freeze({
      ODF: 'Process validation of ODF products',
      HGC: 'Process validation of HGC products',

      DRAFT: 'Draft Studies'
    });

    const HOLD_TIME_TABS = Object.freeze({
      ODF_BULK: 'Bulk hold time study for ODF',
      CAPSULE_BULK: 'Bulk hold time study for Capsule',
      DISPENSED_API: 'Dispensed API hold time',
      DRAFT: 'Draft Studies'
    });

    const CLEANING_TABS = Object.freeze({
      ODF_EQUIP: 'Cleaning validation for ODF equipment',
      CAPSULE_EQUIP: 'Cleaning validation for capsule equipment',
      CHT: 'CHT',
      DHT: 'DHT',
      CAMPAIGN: 'Campaign length',
      NEW_EQUIP: 'Results of new Equipment',
      DRAFT: 'Draft Studies'
    });

    const ALLOWED_FILE_TYPES = Object.freeze({
      'application/pdf': '.pdf',
      'application/msword': '.doc',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '.docx',
      'application/vnd.ms-excel': '.xls',
      'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': '.xlsx',
      'application/vnd.ms-excel.sheet.macroEnabled.12': '.xlsm',
      'image/jpeg': '.jpg/.jpeg',
      'image/png': '.png'
    });
    const MAX_FILE_SIZE = 25 * 1024 * 1024;

    let currentUser = null;
    let currentProfile = null;
    let currentModule = MODULES.STUDIES;
    let currentCategory = 'Process Validation';
    let currentSubTab = PROCESS_TABS.ODF;
    let calibrationSubTab = 'Monthly Plan';
    let qualificationSubTab = 'Monthly Plan';

    let records = [];
    let moduleRecords = [];
    let prPoRecords = [];
    let sopRecords = [];
    let selectedModuleIds = new Set();
    let filesByParent = [];
    let users = [];
    let auditLogs = [];
    let pendingAction = null;

    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeFileName = name => String(name).replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 180);
    const nowLabel = value => {
      if (!value) return '—';
      const d = value?.toDate ? value.toDate() : new Date(value);
      return Number.isNaN(d.getTime()) ? '—' : d.toLocaleString();
    };
    const colRef = name => collection(db, 'artifacts', appId, 'public', 'data', name);
    const docRef = (name, id) => doc(db, 'artifacts', appId, 'public', 'data', name, id);

    const can = (...roles) => !!currentProfile && roles.includes(currentProfile.role);
    const isAdmin = () => can(ROLES.ADMIN);
    const isCreator = () => can(ROLES.CREATOR);
    const isReviewer = () => can(ROLES.SECTION_HEAD, ROLES.REVIEWER, ROLES.DEPUTY, ROLES.QA_MANAGER);
    const isViewer = () => can(ROLES.VIEWER);
    const canSeeSOPs = () => can(ROLES.CREATOR, ROLES.SECTION_HEAD, ROLES.DEPUTY, ROLES.QA_MANAGER, ROLES.ADMIN);

    async function sendEmailNotification(recipientEmail, actionTaken, username, productDetails, currentStatus, auditDetails) {
      if (!window.emailjs || !recipientEmail) return;
      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: recipientEmail,
          action_taken: actionTaken || 'System Action',
          timestamp: new Date().toLocaleString(),
          username: username || currentProfile?.displayName || currentUser?.email || 'Unknown User',
          product_details: productDetails || 'N/A',
          current_status: currentStatus || 'N/A',
          audit_details: auditDetails || 'No additional details provided.'
        });
      } catch (err) {
        console.error('EmailJS dispatch failed:', err);
      }
    }
     
    function showMessage(title = 'Information', text = '', type = 'info') {
      if (!title && !text) return;
      $('messageTitle').textContent = title || 'Notification';
      $('messageText').textContent = text || title;
      $('messageIcon').innerHTML = type === 'error' ? '<i class="fas fa-times-circle text-4xl text-red-500"></i>' : type === 'success' ? '<i class="fas fa-check-circle text-4xl text-green-500"></i>' : '<i class="fas fa-info-circle text-4xl text-blue-500"></i>';
      $('messageModal').classList.add('active');
    }

    function confirmAction(title, text, callback, requireReason=false, reasonLabel='Reason / comment *') {
      pendingAction = callback;
      $('confirmTitle').textContent = title;
      $('confirmText').textContent = text;
      $('reasonLabel').textContent = reasonLabel;
      $('reasonInput').value = '';
      $('reasonWrap').classList.toggle('hidden', !requireReason);
      $('confirmModal').classList.add('active');
    }

    function closeModals() {
      document.querySelectorAll('.modal').forEach(x => x.classList.remove('active'));
      pendingAction = null;
    }

    async function logAudit(action, parentId='', parentName='', details='', previousStatus='', newStatus='') {
      try { 
        await addDoc(colRef('audit'), {
          userId: currentUser.uid,
          userName: currentProfile?.displayName || currentProfile?.username || currentUser.email || currentUser.uid,
          userRole: currentProfile?.role || 'Unknown',
          action, studyId: parentId || null, studyName: parentName || null,
          previousStatus: previousStatus || null, newStatus: newStatus || null,
          details: details || '', createdAt: serverTimestamp(), clientTimestamp: new Date().toISOString()
        }); 
      } catch (e) { console.error('Audit write failed', e); }
    }

    function statusBadge(status) {
      const cls = status === STATUS.APPROVED || status === STATUS.COMPLETED ? 'bg-green-100 text-green-800 border-green-200' : status === STATUS.REJECTED ? 'bg-red-100 text-red-800 border-red-200' : status === STATUS.RETURNED ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-blue-50 text-blue-800 border-blue-200';
      return `<span class="px-2 py-1 inline-flex text-xs font-semibold rounded-full border ${cls}">${esc(status || '—')}</span>`;
    }

    function actionBadge(actionVal) {
      const isExecuted = actionVal === ACTIONS.EXECUTED;
      const cls = isExecuted ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-indigo-100 text-indigo-800 border-indigo-200';
      return `<span class="px-2 py-0.5 inline-flex text-[10px] font-bold rounded border ${cls}">${esc(actionVal || ACTIONS.IN_PLAN)}</span>`;
    }

    function resetAppUI() {
      $('loginSection').classList.remove('hidden');
      $('dashboardSection').classList.add('hidden');
      $('userInfo').classList.add('hidden');
      $('userInfo').classList.remove('flex');
      $('loginForm').reset();
      $('loginError').classList.add('hidden');
    }

    function configureNavigation() {
      $('userManagementBtn').classList.toggle('hidden', !isAdmin());
      $('auditTrailBtn').classList.toggle('hidden', !can(ROLES.ADMIN, ROLES.QA_MANAGER, ROLES.DEPUTY));
      $('sopsNavBtn').classList.toggle('hidden', !canSeeSOPs());
      $('currentUserDisplay').textContent = currentProfile?.displayName || currentProfile?.username || currentUser.email;
      $('currentUserRole').textContent = currentProfile?.role || 'Unassigned';
      $('currentUserDepartment').textContent = currentProfile?.department || '—';
    }

    async function loadProfile(user) {
      const snap = await getDoc(docRef('users', user.uid));
      if (!snap.exists()) throw new Error('Your account exists, but no ValidApp profile was found. Contact an Administrator.');
      const profile = snap.data();
      if (!profile.role || !ROLE_LIST.includes(profile.role)) throw new Error('Your ValidApp profile has an invalid role.');
      if (profile.disabled === true) throw new Error('Your ValidApp account is disabled.');
      return { id: snap.id, ...profile };
    }

    async function loadData() {
      if (!currentProfile) return;
      try {
        let q;
        if (isAdmin()) q = query(colRef('records'), orderBy('createdAt', 'desc'));
        else if (isCreator()) q = query(colRef('records'), where('createdByUid', '==', currentUser.uid));
        else if (can(ROLES.SECTION_HEAD)) q = query(colRef('records'), where('status', '==', STATUS.PENDING_SECTION_HEAD));
        else if (can(ROLES.REVIEWER)) q = query(colRef('records'), where('status', '==', STATUS.PENDING_REVIEWER));
        else if (can(ROLES.DEPUTY)) q = query(colRef('records'), where('status', '==', STATUS.PENDING_DEPUTY));
        else if (can(ROLES.QA_MANAGER)) q = query(colRef('records'), where('status', '==', STATUS.PENDING_QA));
        else q = query(colRef('records'), where('status', '==', STATUS.APPROVED));
        const snap = await getDocs(q);
        records = snap.docs.map(d => ({id:d.id, ...d.data()}));
        records.sort((a,b) => String(b.createdAt?.seconds || '').localeCompare(String(a.createdAt?.seconds || '')));
        renderStudies();
      } catch (e) {
        console.error(e);
        showMessage('Data access error', 'The records could not be loaded.', 'error');
      }
    }

    function recordActionButtons(r) {
      const buttons = [];
      const owner = isAdmin() || r.createdByUid === currentUser?.uid || r.createdBy === currentProfile?.username;
      const isDraftStudy = r.status === STATUS.DRAFT;
      
      if (isViewer()) {
        if (r.status === STATUS.APPROVED) {
          buttons.push(`<button class="text-gray-700 text-xs font-semibold" data-files="${esc(r.id)}"><i class="fas fa-download mr-1"></i>Files / Download</button>`);
        }
        return buttons.join(' ');
      }

      if (owner && [STATUS.DRAFT, STATUS.RETURNED].includes(r.status)) buttons.push(`<button class="text-purple-600 hover:text-purple-800 text-xs font-semibold" data-edit="${esc(r.id)}"><i class="fas fa-edit mr-1"></i>Edit</button>`);
      if (owner && r.status === STATUS.DRAFT) {
        buttons.push(`<button class="text-blue-600 hover:text-blue-800 text-xs font-semibold" data-submit="${esc(r.id)}"><i class="fas fa-paper-plane mr-1"></i>Submit</button>`);
        buttons.push(`<button class="text-red-600 hover:text-red-800 text-xs font-semibold" data-delete-study="${esc(r.id)}"><i class="fas fa-trash-alt mr-1"></i>Delete / Cancel</button>`);
      }
      
      if (!isDraftStudy && r.status === STATUS.APPROVED && (isAdmin() || owner)) {
        if (r.action !== ACTIONS.EXECUTED) {
          buttons.push(`<button class="text-emerald-600 hover:text-emerald-800 font-bold text-xs bg-emerald-50 px-2 py-1 rounded border border-emerald-200" data-execute-study="${esc(r.id)}"><i class="fas fa-check-circle mr-1"></i>Execute</button>`);
        } else {
          buttons.push(`<button class="text-indigo-600 hover:text-indigo-800 text-xs bg-indigo-50 px-2 py-1 rounded border border-indigo-200" data-revert-study="${esc(r.id)}"><i class="fas fa-undo mr-1"></i>Mark In Plan</button>`);
        }
      }

      if (can(ROLES.SECTION_HEAD) && r.status === STATUS.PENDING_SECTION_HEAD) buttons.push(`<button class="text-blue-600 text-xs font-semibold" data-review="${esc(r.id)}"><i class="fas fa-check-circle mr-1"></i>Complete Review</button>`);
      if (can(ROLES.REVIEWER) && r.status === STATUS.PENDING_REVIEWER) buttons.push(`<button class="text-blue-600 text-xs font-semibold" data-review="${esc(r.id)}"><i class="fas fa-check-circle mr-1"></i>Complete Review</button>`);
      if (can(ROLES.DEPUTY) && r.status === STATUS.PENDING_DEPUTY) buttons.push(`<button class="text-blue-600 text-xs font-semibold" data-review="${esc(r.id)}"><i class="fas fa-check-circle mr-1"></i>Complete Review</button>`);
      if (can(ROLES.QA_MANAGER) && r.status === STATUS.PENDING_QA) buttons.push(`<button class="text-green-600 text-xs font-semibold" data-approve="${esc(r.id)}"><i class="fas fa-thumbs-up mr-1"></i>Approve</button>`);
      if (isReviewer() && ![STATUS.APPROVED, STATUS.REJECTED].includes(r.status)) buttons.push(`<button class="text-amber-600 text-xs font-semibold" data-return="${esc(r.id)}"><i class="fas fa-undo mr-1"></i>Return</button>`);
      if (can(ROLES.QA_MANAGER) && r.status === STATUS.PENDING_QA) buttons.push(`<button class="text-red-600 text-xs font-semibold" data-reject="${esc(r.id)}"><i class="fas fa-ban mr-1"></i>Reject</button>`);
      
      buttons.push(`<button class="text-gray-600 text-xs font-semibold" data-files="${esc(r.id)}"><i class="fas fa-paperclip mr-1"></i>Files</button>`);
      
      if (!isDraftStudy) {
        buttons.push(`<button class="text-gray-600 text-xs font-semibold" data-history="${esc(r.id)}"><i class="fas fa-history mr-1"></i>History</button>`);
      }
      return buttons.join(' ');
    }

    async function setStudyActionStatus(id, newActionVal) {
      const r = records.find(x => x.id === id); if (!r) return;
      if (r.status === STATUS.DRAFT) return showMessage('Draft Notice', 'Action execution tracking is disabled while the study is in Draft stage.', 'info');
      try {
        const oldStatus = r.status;
        await updateDoc(docRef('records', id), {
          action: newActionVal,
          updatedAt: serverTimestamp(),
          lastActionByUid: currentUser.uid,
          lastActionByName: currentProfile?.displayName || currentUser.email
        });
        await logAudit('Study Action Executed / Updated', id, r.productName, `Action updated to: ${newActionVal}`, oldStatus, oldStatus);
        await sendEmailNotification(currentUser.email, `Action Status Updated (${newActionVal}): ${r.productName}`, currentProfile?.displayName || currentUser.email, r.productName, oldStatus, `Item action successfully updated to ${newActionVal}.`);
        showMessage('Success', `Study action status updated to "${newActionVal}".`, 'success');
        await loadData();
      } catch (e) {
        showMessage('Action failed', friendlyError(e), 'error');
      }
    }

    async function deleteStudy(id) {
      const r = records.find(x => x.id === id); if (!r) return;
      if (r.status !== STATUS.DRAFT) return showMessage('Cannot Delete', 'Only unsubmitted (Draft) studies can be deleted or cancelled.', 'error');
      
      confirmAction('Delete / Cancel Study', `Are you sure you want to delete the unsubmitted study "${r.productName}"?`, async () => {
        try {
          await deleteDoc(docRef('records', id));
          await sendEmailNotification(currentUser.email, `Study Deleted / Cancelled: ${r.productName}`, currentProfile?.displayName || currentUser.email, r.productName, 'Deleted', 'Unsubmitted draft study was deleted/cancelled.');
          showMessage('Deleted', 'Study successfully deleted.', 'success');
          await loadData();
        } catch (e) {
          showMessage('Deletion failed', friendlyError(e), 'error');
        }
      });
    }

    function renderSubTabsForCategory() {
      const processSubTabs = $('processSubTabs');
      const holdTimeSubTabs = $('holdTimeSubTabs');
      const cleaningSubTabs = $('cleaningSubTabs');

      processSubTabs.classList.add('hidden');
      holdTimeSubTabs.classList.add('hidden');
      cleaningSubTabs.classList.add('hidden');

      if (currentCategory === 'Process Validation') {
        processSubTabs.classList.remove('hidden');
      } else if (currentCategory === 'Hold Time Study') {
        holdTimeSubTabs.classList.remove('hidden');
      } else if (currentCategory === 'Cleaning Validation') {
        cleaningSubTabs.classList.remove('hidden');
      }
    }

    function renderStudies() {
      renderSubTabsForCategory();
      const q = $('searchInput').value.trim().toLowerCase();
      const stage = $('filterStage').value;
      const status = $('filterStatus').value;
      const scale = $('filterScale').value;
      const category = currentCategory;
      
      let filtered = records.filter(r => r.studyCategory === category && (!q || `${r.productName||''} ${r.productType||''}`.toLowerCase().includes(q)) && (stage === 'All' || r.stage === stage) && (status === 'All' || r.status === status) && (scale === 'All' || r.scale === scale));
      
      if (currentSubTab === PROCESS_TABS.DRAFT || currentSubTab === HOLD_TIME_TABS.DRAFT || currentSubTab === CLEANING_TABS.DRAFT) {
        filtered = filtered.filter(r => r.status === STATUS.DRAFT);
      } else {
        filtered = filtered.filter(r => r.status !== STATUS.DRAFT);
        if (currentCategory === 'Process Validation') {
          if (currentSubTab === PROCESS_TABS.ODF) filtered = filtered.filter(r => (r.productType || '').toLowerCase().includes('odf'));
          if (currentSubTab === PROCESS_TABS.HGC) filtered = filtered.filter(r => (r.productType || '').toLowerCase().includes('hgc') || (r.productType || '').toLowerCase().includes('capsule'));
          if (currentSubTab === PROCESS_TABS.VERIFICATION) filtered = filtered.filter(r => (r.stage || '').toLowerCase().includes('verification'));
        } else if (currentCategory === 'Hold Time Study') {
          if (currentSubTab === HOLD_TIME_TABS.ODF_BULK) filtered = filtered.filter(r => (r.stage || '').toLowerCase().includes('odf') || (r.productType || '').toLowerCase().includes('odf'));
          if (currentSubTab === HOLD_TIME_TABS.CAPSULE_BULK) filtered = filtered.filter(r => (r.stage || '').toLowerCase().includes('capsule') || (r.productType || '').toLowerCase().includes('capsule'));
          if (currentSubTab === HOLD_TIME_TABS.DISPENSED_API) filtered = filtered.filter(r => (r.stage || '').toLowerCase().includes('dispensed') || (r.productType || '').toLowerCase().includes('api'));
        } else if (currentCategory === 'Cleaning Validation') {
          if (currentSubTab === CLEANING_TABS.ODF_EQUIP) filtered = filtered.filter(r => (r.stage || '').toLowerCase().includes('odf') || (r.notes || '').toLowerCase().includes('odf'));
          if (currentSubTab === CLEANING_TABS.CAPSULE_EQUIP) filtered = filtered.filter(r => (r.stage || '').toLowerCase().includes('capsule') || (r.notes || '').toLowerCase().includes('capsule'));
          if (currentSubTab === CLEANING_TABS.CHT) filtered = filtered.filter(r => (r.stage || '').toUpperCase() === 'CHT');
          if (currentSubTab === CLEANING_TABS.DHT) filtered = filtered.filter(r => (r.stage || '').toUpperCase() === 'DHT');
          if (currentSubTab === CLEANING_TABS.CAMPAIGN) filtered = filtered.filter(r => (r.stage || '').toLowerCase().includes('campaign'));
          if (currentSubTab === CLEANING_TABS.NEW_EQUIP) filtered = filtered.filter(r => (r.stage || '').toLowerCase().includes('new equipment'));
        }
      }
      
      if (isViewer()) {
        filtered = filtered.filter(r => r.status === STATUS.APPROVED);
      }

      $('dataTableBody').innerHTML = filtered.map(r => `<tr class="hover:bg-gray-50">
        <td class="px-4 py-3 font-medium text-gray-900">${esc(r.productName)}<div class="text-xs text-gray-500">${esc(r.productType)}</div></td>
        <td class="px-4 py-3 text-xs">${esc(r.studyCategory)}</td>
        <td class="px-4 py-3 text-xs">${esc(r.date || r.studyDate)}<div class="font-semibold mt-1">${esc(r.stage)}</div></td>
        <td class="px-4 py-3 text-xs">${esc(r.scale)}<div class="mt-1 flex items-center gap-1"><span class="bg-blue-100 text-blue-800 px-1 rounded">${esc(r.version)}</span> ${actionBadge(r.action)}</div></td>
        <td class="px-4 py-3 text-xs max-w-[220px] truncate" title="${esc(r.reason)}">${esc(r.reason)}<div class="text-gray-400 truncate">${esc(r.notes || '')}</div></td>
        <td class="px-4 py-3 whitespace-nowrap">${statusBadge(r.status)}<div class="text-[10px] text-gray-500 mt-1">Created: ${esc(r.createdByName || r.createdBy || '—')}</div></td>
        <td class="px-4 py-3 text-center"><div class="flex flex-wrap justify-center gap-2">${recordActionButtons(r)}</div></td>
      </tr>`).join('');
      $('emptyState').classList.toggle('hidden', filtered.length !== 0);
    }

    function openRecordModal(record=null) {
      if (isViewer()) return;
      $('recordForm').reset();
      $('recordId').value = record?.id || '';
      $('modalTitle').textContent = record ? 'Edit Validation Study' : 'Add New Validation Study';
      $('studyCategory').value = record?.studyCategory || currentCategory;
      $('studyStatus').value = record?.status || STATUS.DRAFT;
      $('productName').value = record?.productName || '';
      $('productType').value = record?.productType || 'ODF Product';
      $('studyDate').value = record?.date || '';
      $('stage').value = record?.stage || 'Raw';
      $('version').value = record?.version || 'v1.0';
      $('scale').value = record?.scale || 'Lab Scale';
      $('studyAction').value = record?.action || ACTIONS.IN_PLAN;
      $('reason').value = record?.reason || '';
      $('notes').value = record?.notes || '';
      $('reviewerDepartment').value = record?.reviewerDepartment || '';
      $('requireOtherDeptReview').checked = !!record?.requireOtherDeptReview;
      $('studyFileInput').value = ''; 
      $('recordModal').classList.add('active');
    }

    async function saveStudy(e) {
      e.preventDefault();
      if (!(isAdmin() || isCreator())) return showMessage('Unauthorized', 'You are not permitted to edit studies.', 'error');
      const id = $('recordId').value;
      const data = {
        productName: $('productName').value.trim(), studyCategory: $('studyCategory').value, productType: $('productType').value,
        date: $('studyDate').value, stage: $('stage').value, version: $('version').value.trim(), scale: $('scale').value,
        action: $('studyAction').value,
        reason: $('reason').value.trim(), notes: $('notes').value.trim(), reviewerDepartment: $('reviewerDepartment').value.trim(),
        requireOtherDeptReview: $('requireOtherDeptReview').checked, updatedAt: serverTimestamp()
      };
      if (!data.productName || !data.date || !data.reason || !data.version) return showMessage('Missing fields', 'Complete all required fields.', 'error');
      try {
        let savedId = id;
        if (id) {
          await updateDoc(docRef('records', id), data);
          await logAudit('Study Modified', id, data.productName, 'Study updated.');
          showMessage('Success', 'Study updated successfully.', 'success');
        } else {
          const payload = {...data, status: STATUS.DRAFT, createdByUid: currentUser.uid, createdByName: currentProfile.displayName || currentUser.email, createdAt: serverTimestamp()};
          const refDoc = await addDoc(colRef('records'), payload);
          savedId = refDoc.id;
          showMessage('Success', 'New study created as Draft.', 'success');
        }

        const studyFileInput = $('studyFileInput');
        if (studyFileInput && studyFileInput.files.length > 0) {
          await uploadFiles(savedId, studyFileInput, 'study');
        }

        closeModals(); 
        await loadData();
      } catch (err) { console.error(err); showMessage('Save failed', friendlyError(err), 'error'); }
    }

    async function submitStudy(id) {
      const r = records.find(x=>x.id===id); if (!r) return;
      try { 
        await updateDoc(docRef('records',id),{status:STATUS.PENDING_SECTION_HEAD,submittedAt:serverTimestamp(),updatedAt:serverTimestamp()}); 
        await logAudit('Study Submitted',id,r.productName,'Submitted for review.',STATUS.DRAFT,STATUS.PENDING_SECTION_HEAD); 
        await sendEmailNotification(currentUser.email, `Study Submitted: ${r.productName}`, currentProfile?.displayName || currentUser.email, r.productName, STATUS.PENDING_SECTION_HEAD, 'Submitted for Section Head review.');
        showMessage('Submitted','Submitted to Section Head.','success'); 
        await loadData(); 
      }
      catch(e){showMessage('Submission failed',friendlyError(e), 'error');}
    }

    function friendlyError(e) {
      const code = e?.code || '';
      if (code.includes('permission-denied')) return 'Permission denied.';
      if (code.includes('network')) return 'Network connection failed.';
      return e?.message || 'An unexpected error occurred.';
    }

    async function loadFiles(parentId, module='study') {
      const field = (module === 'study' || module === MODULES.STUDIES) ? 'studyId' : 'parentId';
      const snap = await getDocs(query(colRef('studyFiles'), where(field, '==', parentId)));
      filesByParent = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => String(b.createdAt?.seconds || '').localeCompare(String(a.createdAt?.seconds || '')));
    }

    function fileTypeAllowed(file) {
      return !!ALLOWED_FILE_TYPES[file.type] || file.name.endsWith('.xlsx') || file.name.endsWith('.xls') || file.name.endsWith('.xlsm') && file.size <= MAX_FILE_SIZE;
    }

    async function uploadFiles(parentId, input, module='study') {
      if (isViewer()) return showMessage('Unauthorized', 'Viewers cannot upload files.', 'error');
      if (!input.files || !input.files.length) return;
      if (!supabaseClient) return showMessage('Supabase Not Initialized', 'Ensure URL and Key are set correctly.', 'error');
      
      const files = Array.from(input.files);
      const isStudyModule = (module === 'study' || module === MODULES.STUDIES);

      for (const file of files) {
        if (!fileTypeAllowed(file)) {
          showMessage('Invalid file', `${file.name}: invalid type or size exceeds 25MB.`, 'error');
          continue;
        }

        const fileId = crypto.randomUUID();
        const safeName = safeFileName(file.name);
        const storagePath = `${appId}/${module}/${parentId}/${fileId}_${safeName}`;

        try {
          $('uploadProgress').textContent = `Uploading ${esc(file.name)} to Supabase...`;
          
          const { data, error } = await supabaseClient.storage
            .from("documents")
            .upload(storagePath, file, { cacheControl: '3600', upsert: false });

          if (error) throw new Error(error.message);

          await addDoc(colRef('studyFiles'), {
            parentId: parentId,
            studyId: isStudyModule ? parentId : null,
            module: module,
            name: file.name,
            contentType: file.type || 'application/octet-stream',
            size: file.size,
            storagePath: storagePath,
            uploadedByUid: currentUser.uid,
            uploadedByName: currentProfile.displayName || currentUser.email,
            uploadedAt: serverTimestamp(),
            createdAt: serverTimestamp()
          });

          await logAudit('File Uploaded', parentId, '', `${file.name}`);
        } catch(e) {
          console.error('Supabase Upload Error:', e);
          showMessage('Upload failed', friendlyError(e), 'error');
        }
      }

      $('uploadProgress').textContent = '';
      await loadFiles(parentId, module);
      renderFileList(parentId, module);
    }

    async function viewFile(file, download=false) {
      try {
        const { data, error } = await supabaseClient.storage
          .from("documents")
          .createSignedUrl(file.storagePath, 60, {
            download: download ? file.name : false
          });

        if (error) throw new Error(error.message);

        if (download) {
          const a = document.createElement('a');
          a.href = data.signedUrl;
          a.download = file.name;
          document.body.appendChild(a);
          a.click();
          a.remove();
        } else {
          window.open(data.signedUrl, '_blank', 'noopener');
        }
      } catch(e) {
        showMessage('Access denied', friendlyError(e), 'error');
      }
    }

    async function deleteFile(file) {
      if (isViewer()) return showMessage('Unauthorized', 'Viewers cannot delete files.', 'error');
      
      confirmAction('Delete file', `Are you sure you want to delete "${file.name}"?`, async () => {
        try {
          const { error } = await supabaseClient.storage
            .from("documents")
            .remove([file.storagePath]);
            
          if (error) throw new Error(error.message);

          await updateDoc(docRef('studyFiles', file.id), { deletedAt: serverTimestamp() });
          
          const targetParent = file.parentId || file.studyId;
          await logAudit('File Deleted', targetParent, '', `Deleted file: ${file.name}`);
          
          await loadFiles(targetParent, file.module);
          renderFileList(targetParent, file.module);
          showMessage('Deleted', 'File successfully removed.', 'success');
        } catch(e) {
          showMessage('Delete failed', friendlyError(e), 'error');
        }
      });
    }

    function renderFileList(parentId, module='study') {
      const uploadContainer = $('uploadFileContainer');
      if (uploadContainer) uploadContainer.classList.toggle('hidden', isViewer());

      const activeFiles = filesByParent.filter(f => !f.deletedAt);

      $('fileList').innerHTML = activeFiles.map(f => `<div class="border rounded-lg p-3 flex flex-wrap items-center justify-between gap-3 bg-gray-50">
        <div>
          <div class="font-semibold text-sm">${esc(f.name)}</div>
          <div class="text-xs text-gray-500">${esc(f.contentType)} · ${(f.size/1024/1024).toFixed(2)} MB · ${esc(nowLabel(f.uploadedAt))}</div>
        </div>
        <div class="flex gap-3 items-center">
          ${!isViewer() ? `<button data-view-file="${esc(f.id)}" class="text-blue-600 text-xs font-semibold hover:underline">View</button>` : ''}
          <button data-download-file="${esc(f.id)}" class="text-gray-700 text-xs font-semibold hover:underline">Download</button>
          ${!isViewer() ? `<button data-delete-file="${esc(f.id)}" class="text-red-600 text-xs font-semibold hover:underline flex items-center gap-1"><i class="fas fa-trash-alt text-[10px]"></i>Delete</button>` : ''}
        </div>
      </div>`).join('') || '<div class="text-sm text-gray-500">No documents found.</div>';

      $('fileParentId').value = parentId;
      $('fileModule').value = module;
      $('fileModal').classList.add('active');
    }

    async function openFiles(parentId, module='study') {
      await loadFiles(parentId, module);
      renderFileList(parentId, module);
    }

    async function showHistory(studyId) {
      if (isViewer()) return;
      const snap = await getDocs(query(colRef('reviews'), where('studyId', '==', studyId)));
      const items = snap.docs.map(d => d.data()).sort((a,b) => String(b.createdAt?.seconds || '').localeCompare(String(a.createdAt?.seconds || '')));
      $('historyBody').innerHTML = items.map(x => `<div class="border-l-4 border-blue-300 pl-4 py-2">
        <div class="font-semibold text-sm">${esc(x.action || 'Review')} — ${esc(x.reviewerRole || '')}</div>
        <div class="text-xs text-gray-500">${esc(x.reviewerName)} · ${esc(nowLabel(x.createdAt))}</div>
        <div class="text-sm mt-1 whitespace-pre-wrap">${esc(x.comment || 'No comment recorded.')}</div>
      </div>`).join('') || '<div class="text-sm text-gray-500">No review history.</div>';
      $('historyModal').classList.add('active');
    }

    async function loadModule(module) { 
      currentModule = module; 
      selectedModuleIds.clear();
      const collectionName = module === MODULES.CALIBRATION ? 'calibration' : 'qualification'; 
      try {
        let q = query(colRef(collectionName), orderBy('createdAt', 'desc')); 
        const snap = await getDocs(q); 
        moduleRecords = snap.docs.map(d => ({id:d.id, ...d.data()})); 
        renderModuleTable();
      } catch(e) { showMessage('Module access error', friendlyError(e), 'error'); }
    }

    }

    function setCategoryTabs() {
      document.querySelectorAll('.study-tab').forEach(x => x.classList.remove('bg-white', 'text-primary', 'shadow-sm', 'font-bold'));
      const id = currentCategory === 'Process Validation' ? 'tabProcess' : currentCategory === 'Hold Time Study' ? 'tabHoldTime' : 'tabCleaning';

    function hideAllViews() {
      $('studiesView').classList.add('hidden');$('moduleView').classList.add('hidden');

    async function showStudies() {
      currentModule = MODULES.STUDIES;
      hideAllViews();
      $('studiesView').classList.remove('hidden');
      setCategoryTabs();
      setActiveMainNavLink('studiesNav');
      configureNavigation();

    async function handleAzureSSO() {
      try {
        const loginResponse = await msalInstance.loginPopup({ scopes: ["User.Read", "openid", "profile", "email"] });
        const email = loginResponse.account.username.toLowerCase();
        $('username').value = email;
        $('loginError').classList.add('hidden');
      } catch (error) {
        $('loginError').textContent = 'Azure AD authentication failed.';$('loginError').classList.remove('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      $('loginForm').addEventListener('submit', async e => {
        e.preventDefault();
        try {
          await signInWithEmailAndPassword(auth, $('username').value.trim(), $('password').value);$('loginError').classList.add('hidden');
        } catch (err) {
          $('loginError').textContent = 'Invalid email or password.';$('loginError').classList.remove('hidden');
        }
      });

      $('azureSsoBtn').addEventListener('click', handleAzureSSO);
      $('logoutBtn').addEventListener('click', () => signOut(auth));$('recordForm').addEventListener('submit', saveStudy);

      // Fix: Ensure Add Study button opens record modal correctly
      $('addRecordBtn').addEventListener('click', () => openRecordModal());
      
      $('studiesNav').addEventListener('click', () => showStudies());$('tabProcess').addEventListener('click', () => { currentCategory = 'Process Validation'; currentSubTab = PROCESS_TABS.ODF; setCategoryTabs(); renderStudies(); });
      $('tabHoldTime').addEventListener('click', () => { currentCategory = 'Hold Time Study'; currentSubTab = HOLD_TIME_TABS.ODF_BULK; setCategoryTabs(); renderStudies(); });$('tabCleaning').addEventListener('click', () => { currentCategory = 'Cleaning Validation'; currentSubTab = CLEANING_TABS.ODF_EQUIP; setCategoryTabs(); renderStudies(); });

      document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModals));

      document.addEventListener('click', async e => {
        const t = e.target.closest('button'); if (!t) return;
        if (t.dataset.edit) { const r = records.find(x => x.id === t.dataset.edit); if (r) openRecordModal(r); }
        if (t.dataset.submit) await submitStudy(t.dataset.submit);
        if (t.dataset.deleteStudy) await deleteStudy(t.dataset.deleteStudy);
        if (t.dataset.executeStudy) await setStudyActionStatus(t.dataset.executeStudy, ACTIONS.EXECUTED);
        if (t.dataset.revertStudy) await setStudyActionStatus(t.dataset.revertStudy, ACTIONS.IN_PLAN);
        if (t.dataset.files) await openFiles(t.dataset.files, 'study');
        if (t.dataset.history) await showHistory(t.dataset.history);
        if (t.dataset.viewFile) { const f = filesByParent.find(x => x.id === t.dataset.viewFile); if (f) await viewFile(f, false); }
        if (t.dataset.downloadFile) { const f = filesByParent.find(x => x.id === t.dataset.downloadFile); if (f) await viewFile(f, true); }
        if (t.dataset.deleteFile) { const f = filesByParent.find(x => x.id === t.dataset.deleteFile); if (f) await deleteFile(f); }
      });

      $('fileInput').addEventListener('change', e => {
        uploadFiles($('fileParentId').value, e.target, $('fileModule').value);
        e.target.value = '';
      });

      onAuthStateChanged(auth, async user => {
        if (!user) { currentUser = null; currentProfile = null; resetAppUI(); return; }
        try {
          currentUser = user;
          currentProfile = await loadProfile(user);
          $('loginSection').classList.add('hidden');
          $('dashboardSection').classList.remove('hidden');$('dashboardSection').classList.add('flex');
          $('userInfo').classList.remove('hidden');$('userInfo').classList.add('flex');
          configureNavigation();
          await logAudit('Login', '', '', 'Session established.');
          showStudies();
        } catch (e) {
          await signOut(auth);
          $('loginError').textContent = e.message;
          $('loginError').classList.remove('hidden');
        }
      });
    });
  </script>

          <button data-subtab="CHT" class="sub-tab-btn text-gray-600 bg-gray-200 px-3 py-1.5 rounded text-xs font-semibold">CHT</button>
          <button data-subtab="DHT" class="sub-tab-btn text-gray-600 bg-gray-200 px-3 py-1.5 rounded text-xs font-semibold">DHT</button>
          <button data-subtab="Draft Studies" class="sub-tab-btn text-gray-600 bg-gray-200 px-3 py-1.5 rounded text-xs font-semibold">Draft Studies</button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow mb-4 flex flex-wrap gap-4 items-center justify-between">
          <div class="flex flex-wrap gap-3 items-center flex-grow">
            <input type="text" id="searchInput" placeholder="Search product or type..." class="p-2 border rounded-lg text-xs w-64">
            <select id="filterStage" class="p-2 border rounded-lg text-xs">
              <option value="All">All Stages</option>
              <option value="Raw">Raw</option>
              <option value="Verification">Verification</option>
              <option value="Protocol">Protocol</option>
            </select>
            <select id="filterStatus" class="p-2 border rounded-lg text-xs">
              <option value="All">All Statuses</option>
              <option value="Draft">Draft</option>
              <option value="Pending Section Head">Pending Section Head</option>
              <option value="Approved">Approved</option>
            </select>
            <select id="filterScale" class="p-2 border rounded-lg text-xs">
              <option value="All">All Scales</option>
              <option value="Lab Scale">Lab Scale</option>
              <option value="Pilot Scale">Pilot Scale</option>
              <option value="Production Scale">Production Scale</option>
            </select>
            <button id="clearFiltersBtn" class="text-xs text-blue-600 hover:underline"><i class="fas fa-undo mr-1"></i>Reset</button>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow overflow-hidden flex-grow flex flex-col">
          <div class="overflow-x-auto flex-grow">
            <table class="w-full text-left border-collapse">
              <thead class="bg-gray-100 text-gray-700 text-xs uppercase border-b">
                <tr>
                  <th class="px-4 py-3">Product Name</th>
                  <th class="px-4 py-3">Category</th>
                  <th class="px-4 py-3">Date / Stage</th>
                  <th class="px-4 py-3">Scale & Version</th>
                  <th class="px-4 py-3">Reason & Notes</th>
                  <th class="px-4 py-3">Status</th>
                  <th class="px-4 py-3 text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="dataTableBody" class="divide-y divide-gray-200 text-sm"></tbody>
            </table>
          </div>
          <div id="emptyState" class="hidden p-8 text-center text-gray-500">No records found.</div>
        </div>
      </div>

      <!-- Other Modules Placeholders -->
      <div id="moduleView" class="hidden flex flex-col h-full"></div>
      <div id="sopsView" class="hidden flex flex-col h-full"></div>
      <div id="prPoView" class="hidden flex flex-col h-full"></div>

    </section>
  </main>

  <!-- MODALS -->
  <!-- Record Modal (Add/Edit Study) -->
  <div id="recordModal" class="modal fixed inset-0 bg-black/50 z-50 items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 my-8">
      <div class="flex justify-between items-center mb-4 pb-3 border-b">
        <h3 id="modalTitle" class="text-lg font-bold">Add New Validation Study</h3>
        <button data-close class="text-gray-500 hover:text-gray-700"><i class="fas fa-times"></i></button>
      </div>
      <form id="recordForm" class="space-y-4">
        <input type="hidden" id="recordId">
        <input type="hidden" id="studyStatus">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="block text-xs font-semibold mb-1">Product Name *</label><input type="text" id="productName" class="w-full p-2 border rounded text-sm" required></div>
          <div><label class="block text-xs font-semibold mb-1">Category *</label><select id="studyCategory" class="w-full p-2 border rounded text-sm"><option value="Process Validation">Process Validation</option><option value="Hold Time Study">Hold Time Study</option><option value="Cleaning Validation">Cleaning Validation</option></select></div>
          <div><label class="block text-xs font-semibold mb-1">Product Type *</label><input type="text" id="productType" class="w-full p-2 border rounded text-sm" required value="ODF Product"></div>
          <div><label class="block text-xs font-semibold mb-1">Date *</label><input type="date" id="studyDate" class="w-full p-2 border rounded text-sm" required></div>
          <div><label class="block text-xs font-semibold mb-1">Stage *</label><select id="stage" class="w-full p-2 border rounded text-sm"><option value="Raw">Raw</option><option value="Verification">Verification</option><option value="Protocol">Protocol</option></select></div>
          <div><label class="block text-xs font-semibold mb-1">Version *</label><input type="text" id="version" class="w-full p-2 border rounded text-sm" required value="v1.0"></div>
          <div><label class="block text-xs font-semibold mb-1">Scale *</label><select id="scale" class="w-full p-2 border rounded text-sm"><option value="Lab Scale">Lab Scale</option><option value="Pilot Scale">Pilot Scale</option><option value="Production Scale">Production Scale</option></select></div>
          <div><label class="block text-xs font-semibold mb-1">Action *</label><select id="studyAction" class="w-full p-2 border rounded text-sm"><option value="In Plan">In Plan</option><option value="Executed">Executed</option></select></div>
        </div>
        <div><label class="block text-xs font-semibold mb-1">Reason / Objective *</label><textarea id="reason" rows="2" class="w-full p-2 border rounded text-sm" required></textarea></div>
        <div><label class="block text-xs font-semibold mb-1">Notes / Description</label><textarea id="notes" rows="2" class="w-full p-2 border rounded text-sm"></textarea></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div><label class="block text-xs font-semibold mb-1">Reviewer Department</label><input type="text" id="reviewerDepartment" class="w-full p-2 border rounded text-sm"></div>
          <div class="flex items-center pt-5"><label class="flex items-center gap-2 cursor-pointer text-xs font-semibold"><input type="checkbox" id="requireOtherDeptReview" class="rounded"> Require Other Dept Review</label></div>
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1">Attach Documents (PDF, Word, Excel)</label>
          <input type="file" id="studyFileInput" multiple class="w-full p-2 border rounded text-xs bg-gray-50">
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t">
          <button type="button" data-close class="px-4 py-2 bg-gray-200 rounded text-xs font-semibold">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-primary hover:bg-blue-800 text-white rounded text-xs font-bold">Save Study</button>
        </div>
      </form>
    </div>
  </div>

  <!-- File Modal -->
  <div id="fileModal" class="modal fixed inset-0 bg-black/50 z-50 items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-2xl max-w-xl w-full p-6 my-8">
      <div class="flex justify-between items-center mb-4 pb-3 border-b">
        <h3 class="text-lg font-bold">Attached Documents</h3>
        <button data-close class="text-gray-500 hover:text-gray-700"><i class="fas fa-times"></i></button>
      </div>
      <div id="uploadFileContainer" class="mb-4">
        <input type="hidden" id="fileParentId">
        <input type="hidden" id="fileModule">
        <label class="block text-xs font-semibold mb-1">Upload New File</label>
        <div class="flex gap-2">
          <input type="file" id="fileInput" class="w-full p-2 border rounded text-xs bg-gray-50">
        </div>
        <div id="uploadProgress" class="text-xs text-primary font-semibold mt-1"></div>
      </div>
      <div id="fileList" class="space-y-2 max-h-60 overflow-y-auto"></div>
    </div>
  </div>

  <!-- History Modal -->
  <div id="historyModal" class="modal fixed inset-0 bg-black/50 z-50 items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6">
      <div class="flex justify-between items-center mb-4 pb-3 border-b">
        <h3 class="text-lg font-bold">Review History</h3>
        <button data-close class="text-gray-500 hover:text-gray-700"><i class="fas fa-times"></i></button>
      </div>
      <div id="historyBody" class="space-y-3 max-h-80 overflow-y-auto"></div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModal" class="modal fixed inset-0 bg-black/50 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
      <h3 id="confirmTitle" class="text-lg font-bold mb-2">Confirmation</h3>
      <p id="confirmText" class="text-sm text-gray-600 mb-4"></p>
      <div id="reasonWrap" class="mb-4 hidden">
        <label id="reasonLabel" class="block text-xs font-semibold mb-1">Reason / comment *</label>
        <textarea id="reasonInput" rows="3" class="w-full p-2 border rounded text-sm"></textarea>
      </div>
      <div class="flex justify-end gap-3">
        <button data-close class="px-4 py-2 bg-gray-200 rounded text-xs font-semibold">Cancel</button>
        <button id="acceptConfirmBtn" class="px-5 py-2 bg-primary text-white rounded text-xs font-bold">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Message Modal -->
  <div id="messageModal" class="modal fixed inset-0 bg-black/50 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-6 text-center">
      <div id="messageIcon" class="mb-3 flex justify-center"></div>
      <h3 id="messageTitle" class="text-lg font-bold mb-2">Notification</h3>
      <p id="messageText" class="text-sm text-gray-600 mb-5"></p>
      <button data-close class="w-full py-2.5 bg-primary text-white rounded-lg text-xs font-bold">OK</button>
    </div>
  </div>
</body>
</html>
