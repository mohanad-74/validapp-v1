<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ValidApp - Validation Study Tracker - Nerhadou</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- SheetJS for Excel Processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, getDoc, getDocs, addDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const MY_FIREBASE_CONFIG = {
      apiKey: "YOUR_API_KEY_FROM_FIREBASE",
      authDomain: "YOUR_AUTH_DOMAIN_FROM_FIREBASE",
      projectId: "YOUR_PROJECT_ID_FROM_FIREBASE",
      storageBucket: "YOUR_STORAGE_BUCKET_FROM_FIREBASE",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID_FROM_FIREBASE",
      appId: "YOUR_APP_ID_FROM_FIREBASE"
    };

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : MY_FIREBASE_CONFIG;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'validapp-default';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const MODULES = Object.freeze({ STUDIES: 'Studies', CALIBRATION: 'Calibration', QUALIFICATION: 'Qualification' });
    let currentModule = MODULES.CALIBRATION;
    let calibrationRecords = [];

    const $ = id => document.getElementById(id);
    const esc = val => String(val ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const colRef = name => collection(db, 'artifacts', appId, 'public', 'data', name);
    const docRef = (name, id) => doc(db, 'artifacts', appId, 'public', 'data', name, id);

    function showMessage(title, text) {
      $('messageTitle').textContent = title;
      $('messageText').textContent = text;
      $('messageModal').classList.add('active');
    }

    async function loadProfile(user) {
      const snap = await getDoc(docRef('users', user.uid));
      if (!snap.exists()) throw new Error('Profile not found. Contact Admin.');
      return { id: snap.id, ...snap.data() };
    }

    // --- Robust Excel Parser for Calibration ---
    window.triggerExcelImport = () => {
      $('excelFileInput').click();
    };

    window.handleCalibrationExcelImport = async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function (e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rawRows = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });
          
          console.log("--- RAW EXCEL PARSED ROWS ---", rawRows);

          if (rawRows.length === 0) {
            showMessage("Import Error", "The selected Excel sheet appears to be empty.");
            return;
          }

          let importedCount = 0;
          for (const row of rawRows) {
            const certNo = row['Cert. No & Instrument'] || row['Certificate No'] || row['Cert No'] || row['Certificate'] || row['CertNo'] || '';
            const instrument = row['Instrument'] || row['Instrument Name'] || row['Equipment'] || '';
            const department = row['Department'] || row['Dept'] || '';
            const location = row['Location'] || row['Area'] || '';
            const calDate = row['Calibration Date'] || row['Cal Date'] || row['Date'] || '';
            const status = row['Status'] || 'Active';

            if (!certNo && !instrument) continue;

            await addDoc(colRef('calibration'), {
              certNo: String(certNo),
              instrument: String(instrument),
              department: String(department),
              location: String(location),
              calibrationDate: String(calDate),
              status: String(status),
              createdAt: serverTimestamp()
            });
            importedCount++;
          }

          showMessage("Success", `Successfully imported ${importedCount} calibration entries!`);
          event.target.value = '';
          loadCalibration();
        } catch (err) {
          console.error("Excel processing error:", err);
          showMessage("Error", "Failed to parse Excel file. Check console for details.");
        }
      };
      reader.readAsArrayBuffer(file);
    };

    async function loadCalibration() {
      try {
        const q = query(colRef('calibration'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        calibrationRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderCalibrationTable();
      } catch (e) {
        console.error(e);
      }
    }

    function renderCalibrationTable() {
      const tbody = $('calibrationTableBody');
      if (!tbody) return;

      if (calibrationRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500">No calibration records found. Click 'Import Calibration Excel/Macro' to upload data.</td></tr>`;
        return;
      }

      tbody.innerHTML = calibrationRecords.map(r => `
        <tr class="hover:bg-gray-50 border-b">
          <td class="px-4 py-3"><input type="checkbox" data-id="${r.id}"></td>
          <td class="px-4 py-3 font-medium text-gray-900">${esc(r.certNo)} / ${esc(r.instrument)}</td>
          <td class="px-4 py-3">${esc(r.department || '—')}</td>
          <td class="px-4 py-3">${esc(r.location || '—')}</td>
          <td class="px-4 py-3">${esc(r.calibrationDate || '—')}</td>
          <td class="px-4 py-3">${esc(r.status || 'Active')}</td>
          <td class="px-4 py-3 text-right">
            <button class="text-blue-600 hover:text-blue-800"><i class="fas fa-eye"></i></button>
          </td>
        </tr>
      `).join('');
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        $('loginSection').classList.add('hidden');$('dashboardSection').classList.remove('hidden');
        await loadCalibration();
      } else {
        $('loginSection').classList.remove('hidden');$('dashboardSection').classList.add('hidden');
      }
    });

    $('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await signInWithEmailAndPassword(auth, $('loginEmail').value, $('loginPassword').value);
    });
  </script>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
  
  <!-- Hidden File Input for Excel Upload -->
  <input type="file" id="excelFileInput" class="hidden" accept=".xlsx, .xls" onchange="window.handleCalibrationExcelImport(event)">

  <!-- Login Section -->
  <div id="loginSection" class="flex items-center justify-center h-full bg-slate-900">
    <div class="bg-white p-8 rounded-lg shadow-xl w-96">
      <h2 class="text-2xl font-bold mb-6 text-center text-slate-800">ValidApp Login</h2>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="loginEmail" required class="w-full mt-1 px-3 py-2 border rounded-md">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="loginPassword" required class="w-full mt-1 px-3 py-2 border rounded-md">
        </div>
        <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-md font-semibold">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboardSection" class="hidden flex flex-col h-full overflow-hidden">
    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-sm">
      <h1 class="text-xl font-bold">ValidApp - Calibration Module</h1>
      <button onclick="window.location.reload()" class="px-3 py-1.5 bg-red-600 text-white rounded text-sm">Logout</button>
    </header>

    <main class="flex-grow flex flex-col p-6 bg-slate-100 overflow-hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800">Calibration Records</h2>
        <button onclick="window.triggerExcelImport()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-md text-sm font-semibold flex items-center space-x-2">
          <i class="fas fa-file-excel"></i><span>Import Calibration Excel/Macro</span>
        </button>
      </div>

      <div class="bg-white rounded-lg shadow flex flex-col flex-grow overflow-hidden">
        <div class="flex-grow overflow-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100 sticky top-0 text-xs uppercase text-gray-600 font-semibold">
              <tr>
                <th class="px-4 py-3"><input type="checkbox"></th>
                <th class="px-4 py-3">Cert. No & Instrument</th>
                <th class="px-4 py-3">Department</th>
                <th class="px-4 py-3">Location</th>
                <th class="px-4 py-3">Cal. Date</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="calibrationTableBody" class="text-sm divide-y divide-gray-200"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Message Modal -->
  <div id="messageModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
      <h3 id="messageTitle" class="text-lg font-bold mb-2"></h3>
      <p id="messageText" class="text-sm text-gray-600 mb-4"></p>
      <button onclick="document.getElementById('messageModal').classList.remove('active')" class="w-full py-2 bg-blue-600 text-white rounded font-medium">OK</button>
    </div>
  </div>
  <style>.modal.active { display: flex !important; }</style>
</body>
</html>
